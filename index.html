<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beauty Salon</title>
<!-- Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
/* ... (keep your existing styles here) ... */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  line-height: 1.6;
  background-color: #f4f4f4;
  color: #333;
  direction: ltr; /* Default left-to-right */
}
header {
  background-color: #333;
  color: #fff;
  padding: 10px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header h1 {
  margin: 0;
}
.language-switch {
  background: none;
  border: 2px solid #fff;
  color: #fff;
  padding: 5px 10px;
  cursor: pointer;
}
section {
  padding: 20px;
}
.services {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}
.service-card {
  background-color: #fff;
  border-radius: 8px;
  padding: 15px;
  width: calc(33.333% - 20px);
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  align-items: center;
}
.service-image {
  width: 100%;
  height: 150px;
  background-color: #ccc;
  margin-bottom: 10px;
  border-radius: 8px;
}
.service-title {
  font-size: 1.2em;
  margin: 10px 0 5px 0;
}
.service-desc {
  font-size: 0.9em;
  text-align: center;
  margin-bottom: 10px;
}
.service-price {
  font-weight: bold;
  margin-bottom: 10px;
}
.book-btn {
  background-color: #333;
  color: #fff;
  padding: 8px 12px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}
.contact-info, #booking {
  margin-top: 20px;
}
footer {
  background-color: #333;
  color: #fff;
  padding: 10px 20px;
  text-align: center;
}
@media(max-width: 768px) {
  .service-card {
    width: calc(50% - 20px);
  }
}
</style>
</head>
<body>

<header>
  <h1 id="header-title">Beauty Salon</h1>
  <button class="language-switch" onclick="switchLanguage()" id="langBtn">عربى</button>
</header>

<section id="services-section">
  <h2 id="services-title">Our Services</h2>
  <div class="services" id="services">
    <!-- Services will be inserted here by JS -->
  </div>
</section>

<section id="contact-section">
  <h2 id="contact-title">Contact Us</h2>
  <div class="contact-info" id="contact-info">
    <p><strong>Phone:</strong> +1234567890</p>
    <p><strong>Address:</strong> 123 Beauty St, City</p>
  </div>
</section>

<div id="booking">
  <h2 id="booking-title">Book an Appointment</h2>
  <p id="booking-info">Click on a service to book via WhatsApp.</p>
</div>

<footer>
  <p>&copy; 2024 Beauty Salon</p>
</footer>

<script>
// Service data in both languages
const servicesData = {
  en: [
    {
      title: "Facial Treatment",
      desc: "Experience our rejuvenating facial treatments.",
      price: "$50"
    },
    {
      title: "Haircut & Styling",
      desc: "Get a stylish haircut and styling.",
      price: "$40"
    },
    {
      title: "Manicure & Pedicure",
      desc: "Pamper your hands and feet.",
      price: "$30"
    },
    {
      title: "Aromatherapy Massage",
      desc: "Relax with soothing aromatherapy massage.",
      price: "$90"
    },
    {
      title: "Eyebrow Shaping",
      desc: "Define and shape your eyebrows.",
      price: "$30"
    },
    {
      title: "Makeup Session",
      desc: "Professional makeup for special occasions.",
      price: "$70"
    },
    {
      title: "Deep Cleansing Facial",
      desc: "Deep cleaning for clear skin.",
      price: "$60"
    }
  ],
  ar: [
    {
      title: "علاج الوجه",
      desc: "اختبر علاجات الوجه المنعشة والمجددة.",
      price: "₪180"
    },
    {
      title: "قص وتصفيف الشعر",
      desc: "احصل على قصة شعر وتصفيف أنيقة.",
      price: "₪150"
    },
    {
      title: "مانيكير وپديكور",
      desc: "دلل يديك وقدميك.",
      price: "₪100"
    },
    {
      title: "تدليك بالروائح",
      desc: "استرخِ مع تدليك الروائح المهدئ.",
      price: "₪330"
    },
    {
      title: "تشكيل الحواجب",
      desc: "حدد شكل حواجبك.",
      price: "₪100"
    },
    {
      title: "جلسة مكياج",
      desc: "مكياج احترافي للمناسبات الخاصة.",
      price: "₪230"
    },
    {
      title: "تنظيف عميق للبشرة",
      desc: "تنظيف عميق لبشرة نقية.",
      price: "₪200"
    }
  ]
};

let currentLanguage = 'en';

function switchLanguage() {
  currentLanguage = currentLanguage === 'en' ? 'ar' : 'en';
  document.getElementById('langBtn').innerText = currentLanguage === 'en' ? 'عربى' : 'English';
  updateContent();
}

function updateContent() {
  // Update header, titles
  document.getElementById('header-title').innerText = currentLanguage === 'en' ? 'Beauty Salon' : 'منتجع التجميل';
  document.getElementById('services-title').innerText = currentLanguage === 'en' ? 'Our Services' : 'خدماتنا';
  document.getElementById('contact-title').innerText = currentLanguage === 'en' ? 'Contact Us' : 'اتصل بنا';
  document.getElementById('booking-title').innerText = currentLanguage === 'en' ? 'Book an Appointment' : 'احجز موعدًا';
  document.getElementById('booking-info').innerText = currentLanguage === 'en' ? 'Click on a service to book via WhatsApp.' : 'انقر على خدمة للحجز عبر واتساب.';
  document.querySelector('footer p').innerHTML = '&copy; 2024 Beauty Salon';

  // Render services
  renderServices();
}

function renderServices() {
  const servicesContainer = document.getElementById('services');
  servicesContainer.innerHTML = '';

  servicesData[currentLanguage].forEach(service => {
    const card = document.createElement('div');
    card.className = 'service-card';

    const title = document.createElement('div');
    title.className = 'service-title';
    title.innerText = service.title;

    const desc = document.createElement('div');
    desc.className = 'service-desc';
    desc.innerText = service.desc;

    const price = document.createElement('div');
    price.className = 'service-price';
    price.innerText = service.price;

    const button = document.createElement('button');
    button.className = 'book-btn';
    button.innerHTML = '<i class="fas fa-calendar-check"></i> ' + (currentLanguage === 'en' ? 'Book Service' : 'احجز الخدمة');
    button.onclick = () => bookService(service.title, service.price);

    card.appendChild(title);
    card.appendChild(desc);
    card.appendChild(price);
    card.appendChild(button);

    servicesContainer.appendChild(card);
  });
}

function bookService(serviceName, price) {
  alert(`${currentLanguage === 'en' ? 'Booking' : 'الحجز'}: ${serviceName} - ${price}`);
}

// Initialize content
updateContent();
</script>

</body>
</html>
